name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shiftpilot
          POSTGRES_PASSWORD: shiftpilot
          POSTGRES_DB: shiftpilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U shiftpilot" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://shiftpilot:shiftpilot@localhost:5433/shiftpilot
      APP_DATABASE_URL: postgresql+psycopg://shiftpilot_app:shiftpilot_app@localhost:5433/shiftpilot
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # uuid.uuid7 and the lock file need 3.14
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: mypy
      - run: pytest
      # Lost leases, crashes mid-delivery, concurrent publishers and admission races (B6.3).
      - name: fault injection
        run: pytest -m "integration and faults"
      # The worker and relay run as their least-privilege roles inside these tests.
      - run: pytest -m "integration and not faults"
      - name: backend image builds
        run: docker build -t shiftpilot-backend .

  smoke-evals:
    needs: test
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shiftpilot
          POSTGRES_PASSWORD: shiftpilot
          POSTGRES_DB: shiftpilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U shiftpilot" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://shiftpilot:shiftpilot@localhost:5433/shiftpilot
      APP_DATABASE_URL: postgresql+psycopg://shiftpilot_app:shiftpilot_app@localhost:5433/shiftpilot
      JWT_SECRET: ci-only-secret
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m db.init && python -m seed.load
      - run: python -m evals.runner --suite smoke --gate | tee eval-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/*.json
      # TODO(M3): post eval-summary.txt as a PR comment (e.g. marocchino/sticky-pull-request-comment)
