[project]
name = "shiftpilot"
version = "0.1.0"
description = "Workforce scheduling and real-time roster repair: CP-SAT optimization, versioned schedules, human approval."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "mcp>=2.3,<3",
    "langgraph>=0.2",
    "litellm>=1.50",
    "redis>=5.0",
    "langfuse>=2.50",
    "rapidfuzz>=3.9",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "ortools==9.15.6755",
    "alembic>=1.20,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]
voice = [
    "pipecat-ai[deepgram,cartesia,silero,webrtc]>=0.0.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "db", "mcp_server", "agent", "api", "rag", "jobs", "importer", "voice", "evals", "seed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (DATABASE_URL / APP_DATABASE_URL)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"db/migrations/versions/*" = ["E501"]  # generated table definitions

[tool.mypy]
python_version = "3.14"
strict = true
files = ["core", "mcp_server", "api/v2", "db/migrate.py", "db/models_v2.py", "db/init.py", "db/session.py", "seed/world.py", "seed/v2.py"]
ignore_missing_imports = true
